# Typecheck, unit and app tests, build and a smoke test of the built app on
# macOS, Windows and Linux with each supported Node major; the Playwright
# end-to-end journey on Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: [20, 22]
    steps:
      # .gitattributes already pins LF; this also covers files it does not name.
      - name: Check out with LF line ends
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:app
      # Also inside test:app; run on its own so a Credential Manager failure
      # is easy to spot. Real CredWrite/CredRead through the PowerShell helper.
      - name: Windows Credential Manager round-trip (real keychain)
        if: runner.os == 'Windows'
        run: node --import tsx --test app/server/secrets-windows-real.test.ts
      - run: npm run build
      - name: Smoke test the built app (fake mode)
        run: npm run smoke
        timeout-minutes: 3

  e2e:
    name: e2e (ubuntu / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14
